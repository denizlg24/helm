name: Custom desktop installer

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Stable build id from Helm API"
        required: true
        type: string
      app_name:
        description: "Desktop app name"
        required: true
        default: "Helm"
        type: string
      app_identifier:
        description: "Reverse-DNS app identifier"
        required: false
        type: string
      theme:
        description: "Theme to bake into the first-run desktop shell"
        required: true
        default: "sky"
        type: choice
        options:
          - default
          - rose
          - coral
          - blush
          - amber
          - butter
          - mint
          - cyan
          - sky
          - lavender
          - plum
      features:
        description: "Comma-separated module/feature ids to include"
        required: false
        type: string
      icon_dir:
        description: "Optional repo-relative directory containing Tauri icon files"
        required: false
        type: string
      icon_archive_url:
        description: "Optional signed zip URL containing Tauri icon files"
        required: false
        type: string
      upload_folder:
        description: "Optional Deniz Cloud folder path"
        required: false
        type: string
      callback_url:
        description: "Helm API base URL to report the build result to"
        required: false
        type: string
      callback_token:
        description: "Per-build secret echoed back to authorize the result callback"
        required: false
        type: string

env:
  TURBO_TELEMETRY_DISABLED: 1
  HELM_CUSTOM_BUILD_ID: ${{ github.event.inputs.build_id }}
  HELM_CUSTOM_APP_NAME: ${{ github.event.inputs.app_name }}
  HELM_CUSTOM_IDENTIFIER: ${{ github.event.inputs.app_identifier }}
  HELM_CUSTOM_THEME: ${{ github.event.inputs.theme }}
  HELM_CUSTOM_FEATURES: ${{ github.event.inputs.features }}
  HELM_CUSTOM_ICON_DIR: ${{ github.event.inputs.icon_dir }}
  HELM_DESKTOP_UPLOAD_FOLDER: ${{ github.event.inputs.upload_folder }}
  HELM_INSTALLER_CALLBACK_URL: ${{ github.event.inputs.callback_url }}
  HELM_INSTALLER_CALLBACK_TOKEN: ${{ github.event.inputs.callback_token }}
  STORAGE_DENIZ_CLOUD_URL: ${{ secrets.STORAGE_DENIZ_CLOUD_URL }}
  STORAGE_DENIZ_CLOUD_API_KEY: ${{ secrets.STORAGE_DENIZ_CLOUD_API_KEY }}
  VITE_HELM_API_URL: ${{ secrets.VITE_HELM_API_URL }}
  VITE_HELM_CONSOLE_URL: ${{ secrets.VITE_HELM_CONSOLE_URL }}

jobs:
  build:
    name: Build and upload (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: custom-desktop-${{ github.event.inputs.build_id }}-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Linux Tauri deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download custom icons
        if: github.event.inputs.icon_archive_url != ''
        shell: bash
        env:
          ICON_ARCHIVE_URL: ${{ github.event.inputs.icon_archive_url }}
        run: |
          curl --fail --show-error --location --max-time 60 "$ICON_ARCHIVE_URL" -o custom-icons.zip
          mkdir -p .custom-icons
          python -m zipfile -e custom-icons.zip .custom-icons
          echo "HELM_CUSTOM_ICON_DIR=.custom-icons" >> "$GITHUB_ENV"

      - name: Build custom desktop installer
        run: bun run desktop:build:custom

      - name: Upload installers to Deniz Cloud
        id: upload
        env:
          HELM_INSTALLER_RUNNER_OS: ${{ runner.os }}
        run: bun run desktop:upload:artifacts

      - name: Upload manifest to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-desktop-upload-manifest-${{ matrix.os }}
          path: desktop-upload-manifest.json

      - name: Report build result to Helm
        if: always() && github.event.inputs.callback_url != ''
        env:
          HELM_INSTALLER_RUNNER_OS: ${{ runner.os }}
          HELM_INSTALLER_JOB_STATUS: ${{ job.status }}
        run: bun run desktop:report:result
