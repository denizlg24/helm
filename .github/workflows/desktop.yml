name: Desktop build

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/ui/**"
      - "packages/types/**"
      - "packages/api-client/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/ui/**"
      - "packages/types/**"
      - "packages/api-client/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  VITE_HELM_API_URL: ${{ secrets.VITE_HELM_API_URL }}
  VITE_HELM_CONSOLE_URL: ${{ secrets.VITE_HELM_CONSOLE_URL }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Linux Tauri deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        run: bun --filter desktop vite:build

      - name: Tauri build
        run: bun --filter desktop tauri build
